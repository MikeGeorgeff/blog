name: Publish to dev.to

on:
  push:
    branches:
      - main
    paths:
      - content/posts/**
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: sinedied/publish-devto@v2
        with:
          files: 'content/posts/**/*.md'
          devto_key: ${{ secrets.DEVTO_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
